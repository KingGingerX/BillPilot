[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "billpilot"
version = "0.2.0"
description = "Debt negotiation and credit-dispute assistant"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "pydantic>=2.0",
    "python-dotenv>=1.1",
    "streamlit>=1.40",
    "anthropic>=0.40",
    "duckduckgo-search>=6.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
billpilot = "debt_bot.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
