[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "billpilot"
version = "0.2.0"
description = "Debt negotiation and credit-dispute assistant"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "pydantic>=2.0",
    "python-dotenv>=1.1",
    "streamlit>=1.40",
]

[project.optional-dependencies]
ai  = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
billpilot = "debt_bot.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
