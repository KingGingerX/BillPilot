<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReferIt — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #000; color: #e8e8e8;
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  -webkit-font-smoothing: antialiased;
  padding: 24px;
}

.card {
  background: #080808;
  border: 1px solid #1a1a1a;
  border-radius: 14px;
  padding: 48px 44px;
  width: 100%; max-width: 400px;
  text-align: center;
}

.logo-wrap { margin-bottom: 32px; }
.logo-wrap img { height: 72px; width: auto; }

.tagline {
  font-size: .68rem; letter-spacing: .18em; text-transform: uppercase;
  color: #39FF14; margin-bottom: 28px; opacity: .75;
}

.subtitle { font-size: .875rem; color: #555; margin-bottom: 32px; line-height: 1.6; }

.field { text-align: left; margin-bottom: 20px; }
.field label {
  display: block; font-size: .72rem; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase;
  color: #444; margin-bottom: 8px;
}
.field input {
  width: 100%; background: #050505; border: 1px solid #1e1e1e;
  color: #d4d4d4; border-radius: 7px; padding: 12px 14px;
  font-size: .95rem; font-family: 'Courier New', monospace;
  letter-spacing: .08em; outline: none;
  transition: border-color .15s;
}
.field input:focus { border-color: #39FF14; box-shadow: 0 0 0 3px rgba(57,255,20,.08); }
.field input::placeholder { color: #2a2a2a; letter-spacing: .05em; }

.error {
  background: rgba(248,81,73,.08); border: 1px solid rgba(248,81,73,.25);
  color: #f85149; border-radius: 7px; padding: 10px 14px;
  font-size: .83rem; margin-bottom: 20px; text-align: left;
  display: flex; align-items: center; gap: 8px;
}

.btn-submit {
  width: 100%; background: #39FF14; color: #000; font-weight: 700;
  font-size: .95rem; padding: 13px; border-radius: 7px; border: none;
  cursor: pointer; font-family: 'Inter', sans-serif; letter-spacing: -.01em;
  transition: opacity .15s; margin-top: 4px;
}
.btn-submit:hover { opacity: .88; }

.footer-links {
  margin-top: 28px; font-size: .8rem; color: #333; line-height: 2;
}
.footer-links a { color: #555; text-decoration: none; transition: color .15s; }
.footer-links a:hover { color: #e8e8e8; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <img src="/static/logo.jpeg" alt="ReferIt">
  </div>
  <p class="tagline">Good Things To Say.</p>
  <p class="subtitle">Enter your license key to access the dashboard.</p>

  {% if error %}
  <div class="error">
    <span>⚠</span> {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="field">
      <label for="license_key">License Key</label>
      <input type="text" id="license_key" name="license_key"
             placeholder="XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
             autocomplete="off" spellcheck="false" autofocus>
    </div>
    <button type="submit" class="btn-submit">Access Dashboard</button>
  </form>

  <div class="footer-links">
    <a href="/#pricing">Purchase a license</a> &nbsp;·&nbsp; <a href="/">Home</a>
  </div>
</div>
</body>
</html>
