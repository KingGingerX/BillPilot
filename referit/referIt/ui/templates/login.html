<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReferIt — Login</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<style>
  :root { --accent: #39FF14; --accent-dim: #2bcc0f; }
  body { background: #000; color: #e1e4e8; font-family: 'Segoe UI', system-ui, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .login-card { background: #0a0a0a; border: 1px solid #1e1e1e; border-radius: 14px;
                padding: 48px 40px; width: 100%; max-width: 420px; text-align: center; }
  .logo-img { height: 90px; width: auto; margin-bottom: 20px; }
  .tagline { font-size: .68rem; letter-spacing: 3px; text-transform: uppercase; color: var(--accent);
             opacity: .8; margin-bottom: 28px; }
  .subtitle { color: #555; font-size: .875rem; margin-bottom: 32px; }
  label { font-size: .75rem; text-transform: uppercase; letter-spacing: .5px; color: #555;
          font-weight: 600; margin-bottom: 6px; display: block; text-align: left; }
  input[type="text"] { width: 100%; background: #050505; border: 1px solid #1e1e1e; color: #d4d4d4;
                       border-radius: 6px; padding: 12px 14px; font-size: .95rem; font-family: monospace;
                       letter-spacing: 1px; outline: none; transition: border-color .2s; }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(57,255,20,.1); }
  .btn-login { width: 100%; background: var(--accent); border: none; color: #000; font-weight: 700;
               padding: 13px; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 20px;
               letter-spacing: .3px; }
  .btn-login:hover { background: var(--accent-dim); }
  .error { background: #da363315; border: 1px solid #da3633; color: #f85149;
           border-radius: 6px; padding: 10px 14px; font-size: .85rem; margin-bottom: 20px; text-align: left; }
  .footer-links { margin-top: 24px; font-size: .8rem; color: #444; }
  .footer-links a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="login-card">
  <img src="/static/logo.jpeg" alt="ReferIt" class="logo-img">
  <div class="tagline">Good Things To Say.</div>
  <div class="subtitle">Enter your license key to access the dashboard</div>

  {% if error %}
  <div class="error"><i class="bi bi-exclamation-triangle me-2"></i>{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <label for="license_key">License Key</label>
    <input type="text" id="license_key" name="license_key"
           placeholder="XXXXXXXXXXXXXXXXXXXXXXXXXXXX"
           autocomplete="off" spellcheck="false" autofocus>
    <button type="submit" class="btn-login">
      <i class="bi bi-unlock me-2"></i>Access Dashboard
    </button>
  </form>

  <div class="footer-links">
    Don't have a license? <a href="/#pricing">Purchase access</a><br style="margin-bottom:4px">
    <a href="/">Back to home</a>
  </div>
</div>
</body>
</html>
